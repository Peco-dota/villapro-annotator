services:
  visionq:
    build: .
    image: visionq:latest
    container_name: visionq
    restart: unless-stopped
    ports:
      - "8000:8000"
      # TCP push ports — add one per service you configure, e.g.:
      # - "9001:9001"
      # - "9002:9002"
    volumes:
      # All persistent user data — projects, models, recordings, config, database
      - ./villapro-data:/villapro-data
    environment:
      - VISIONQ_SECRET=123   # change this before deploying!
      - VISIONQ_DATA=/villapro-data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

